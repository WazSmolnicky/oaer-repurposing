# Deployed protocol.
#
# Every value the article reports is carried here verbatim with a `# Ref:` line
# naming where it comes from. Every value the article does not report is marked
# as a declared engineering default. The article reports no optimiser, batch
# size, learning rate or schedule for the representation, so the whole `fitting`
# block is a declared default; the `cohort` and `readings` blocks are not.

name: main

seed: 20260831

site_holdout: C

cohort:
  # Ref: Table 1 panel a, the three site rows in each arm. These are decision
  # counts, which is the unit the reported marginals are stated over.
  site_a_decisions: 3412
  site_b_decisions: 2938
  site_c_decisions: 1612
  site_a_prospective_decisions: 1187
  site_b_prospective_decisions: 983
  site_c_prospective_decisions: 544
  # Ref: Table 1 panel a, the pooled patient counts of each arm.
  retrospective_patients: 4318
  prospective_patients: 1586
  # Declared engineering default: derived from the two counts above.
  decisions_per_patient: 1.84
  # Declared engineering default: the article never prints |D| = K, and the
  # directory it describes spans every non-oncology-approved agent. 24 is the
  # width this protocol scores, chosen so the whole run finishes on one CPU.
  candidate_count: 24
  exposed_candidates: 0
  profile_scale: 1.0

catalogue:
  # Declared engineering defaults: the article states the admission rule and the
  # four named agents, not the size of the directory or the negative-sample count.
  non_oncology_indications: 612
  oncology_only_excluded: 96
  # Ref: the seven typed relations of the graph.
  relations: 7
  # Ref: the four typed anchors a patient node attaches through.
  anchor_types: 4
  motif_orders: [2, 3]
  negative_samples: 12
  anchor_corruptions: 5

emulation:
  # Declared engineering defaults: the article reports the trimming rule and the
  # minimum exposed count as parameters of the design without printing them.
  trimming_epsilon: 0.05
  minimum_exposed: 40
  # Ref: Sec. 1.2 and Sec. 2.6, five patient-level folds stratified by site.
  folds: 5
  # Declared engineering default: the censoring floor is stated as a floor, not
  # as a number.
  censoring_floor: 0.05
  # Ref: Algorithm 2 line 1, no dispensing of either agent in the 365 days before
  # time zero.
  new_user_lookback_days: 365
  regularisation: 1.0
  # Ref: Sec. 2.5, horizons set from the real-world median progression-free
  # survival per line rather than from trial medians.
  horizons_months: [8.0, 6.5, 5.5]
  placebo_candidates: 3

encoder:
  # Declared engineering defaults: the article names the encoder family and its
  # inductive property, not its width.
  embedding_dim: 64
  hidden_dim: 64
  layers: 2
  num_basis: 4
  dropout: 0.1
  graph_degree_scale: 8.0
  degree_transfer_gain: 1.0

head:
  # Declared engineering defaults: the head is described by its two routes and
  # the zero-mean condition, not by its widths.
  route_dim: 32
  modifier_dim: 16
  pathology_only_dim: 12
  l2_penalty: 1.0e-4
  outcome_weight_scale: 1.0

gate:
  # Declared engineering defaults: the gate is specified by its rule, and the
  # article prints the trimming fraction and the miscoverage rather than the
  # thresholds themselves.
  miscoverage_alpha: 0.1
  margin_delta: 0.0
  # Ref: Sec. 2.7, the k = 1 and k = 5 read-outs and a rank depth of three.
  rank_depth_k: 3
  # Ref: Algorithm 1 line 10, calibration on the most recent retrospective window.
  calibration_window_months: 12
  transport_clip: 10.0

fitting:
  # Declared engineering defaults. The article reports the model's ranking and
  # discrimination read-outs and its latency, never its training schedule.
  stage1_epochs: 4
  stage2_epochs: 4
  stage3_epochs: 40
  batch_size: 256
  learning_rate: 3.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 50
  total_steps: 3000
  grad_clip: 1.0
  precision: fp32
  device: cpu
  early_stop_patience: 8

readings:
  # Ref: Table 2 note, the ten fixed seeds the paired test runs across.
  seeds: [11, 23, 37, 41, 59, 67, 73, 89, 97, 103]
  # Declared engineering default: the article states the intervals are
  # site-stratified bootstrap intervals without printing the replicate count.
  bootstrap_resamples: 400
  bootstrap_confidence: 0.95
  # Ref: Sec. 1.3, Hits@20 and nDCG@20.
  hits_at: 20
  ndcg_at: 20
  # Ref: Sec. 1.4, the top-five overlap.
  jaccard_top: 5
  # Ref: Sec. 1.3, the twelve-month AUROC.
  landmark_months: 12.0

compute:
  # Ref: Sec. 2 Discussion, the frozen ranking took about eleven minutes per
  # qualifying decision, interquartile range seven to eighteen.
  accelerator: not reported by the manuscript
  peak_memory_gb: null
  wall_clock_per_decision_minutes: 11.0
  wall_clock_interquartile_low: 7.0
  wall_clock_interquartile_high: 18.0
  frozen_throughput_percent: 96.4
  notes: no hardware figure is stated in the manuscript
