# Transfer to independent public cohorts.
#
# Ref: Table 5 panel d. Each public cohort is compared against development performance recomputed with the same modality subset withheld, so the row measures domain shift conditional on what the cohort carries.

# candidate_count: 24
name: transfer_public_cohorts

seed: 20260831

site_holdout: C

cohort:
  site_a_decisions: 3412
  site_b_decisions: 2938
  site_c_decisions: 1612
  site_a_prospective_decisions: 1187
  site_b_prospective_decisions: 983
  site_c_prospective_decisions: 544
  retrospective_patients: 4318
  prospective_patients: 1586
  decisions_per_patient: 1.84
  candidate_count: 24
  exposed_candidates: 0
  profile_scale: 1.0

catalogue:
  non_oncology_indications: 612
  oncology_only_excluded: 96
  relations: 7
  anchor_types: 4
  motif_orders: [2, 3]
  negative_samples: 12
  anchor_corruptions: 5

emulation:
  trimming_epsilon: 0.05
  minimum_exposed: 40
  folds: 5
  censoring_floor: 0.05
  new_user_lookback_days: 365
